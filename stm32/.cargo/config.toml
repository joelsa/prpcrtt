[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# If you have an SWD debugger, you can uncomment this line:
runner = "probe-rs run --chip STM32H723ZGTx"

# If you don't, you can put the pico into the USB loader, and use this
# line instead:
# runner = "picotool load -x -t elf"

[build]
target = "thumbv7em-none-eabihf"        # Cortex-M0 and Cortex-M0+

[env]
DEFMT_LOG = "debug"

[unstable]
build-std = ["core"]
build-std-features = ["panic_immediate_abort"]
